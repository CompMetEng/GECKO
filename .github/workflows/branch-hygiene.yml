name: Branch hygiene

# version.txt is stamped at release time and belongs on main only. develop is
# never "at" a version, it is ahead of the last release by an unknown number of
# changes. .gitignore cannot keep the file off develop: it is consulted only for
# untracked paths, so once the file is tracked on main, a merge of main into
# develop carries it across regardless. This check prevents that.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  no-release-only-files-on-develop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # On a pull_request event this runs against the merge result rather than
      # the pull-request branch, so it answers "would develop contain this once
      # this is merged?", which also catches a file arriving through a merge
      # commit.
      - name: No release-only files on develop
        run: |
          found=$(git ls-files 'version.txt')
          if [ -n "$found" ]; then
            echo "::error::version.txt is stamped at release time and belongs on main only."
            echo "If it arrived here through a merge of main into develop, drop it in the merge commit:"
            echo ""
            echo "  git rm --cached version.txt"
            exit 1
          fi
          echo "No release-only files tracked on develop."
